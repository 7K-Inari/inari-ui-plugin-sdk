name: release

# Detects a merged Release PR (release-please action self-detection — robust
# under merge-commit and squash alike), creates tag + GitHub Release, then
# publishes the npm package. No tag-push triggers, no manual releases.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  publish-npm:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        run: |
          if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.build ? 0 : 1)"; then
            npm run build
          else
            echo "No build script yet (pre-M4 scaffold); skipping"
          fi

      # Trusted publishing requires npm CLI >= 11.5.1 (Node >= 22.14).
      - name: Ensure npm CLI >= 11.5.1
        run: npm install -g npm@^11  # trusted publishing needs >= 11.5.1; npm@12 requires newer Node than some runners carry

      # OIDC trusted publishing — no tokens. Requires the trusted publisher
      # on npmjs.com: org 7K-Inari, repo inari-ui-plugin-sdk, workflow
      # release.yml, action 'npm publish'. Provenance is automatic.
      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --access public
