name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  detect-release:
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.check.outputs.is-release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect merged Release PR
        id: check
        run: |
          MSG="${{ github.event.head_commit.message }}"
          AUTHOR="${{ github.event.head_commit.author.username }}"
          if echo "$MSG" | grep -qE '^chore(\(main\))?: release' || [ "$AUTHOR" = "release-please[bot]" ]; then
            VERSION=$(node -p "require('./package.json').version")
            echo "is-release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "is-release=false" >> "$GITHUB_OUTPUT"
          fi

  tag-and-release:
    needs: detect-release
    if: needs.detect-release.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog notes
        id: notes
        run: |
          VERSION="${{ needs.detect-release.outputs.version }}"
          awk "/^## .*${VERSION}/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > release-notes.md || true
          [ -s release-notes.md ] || echo "Release v${VERSION}" > release-notes.md

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.detect-release.outputs.version }}" -m "Release v${{ needs.detect-release.outputs.version }}"
          git push origin "v${{ needs.detect-release.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-release.outputs.version }}
          name: v${{ needs.detect-release.outputs.version }}
          body_path: release-notes.md

  publish-npm:
    needs: [detect-release, tag-and-release]
    if: needs.detect-release.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        run: |
          if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.build ? 0 : 1)"; then
            npm run build
          else
            echo "No build script yet (pre-M4 scaffold); skipping"
          fi

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
